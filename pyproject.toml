[project]
name = "big-brother-eye"
version = "0.1.0"
description = "Turn any camera into a private, YOLO-powered desk monitor that knows when you are working."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pablo Manjarres" }]
keywords = ["yolo", "computer-vision", "time-tracking", "face-recognition", "mcp", "productivity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "ultralytics>=8.3",
  "opencv-python>=4.10",
  "uvicorn>=0.30",
  "numpy>=1.26",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "icalendar>=6.0",
  "recurring-ical-events>=3.3",
  "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/pablomanjarres/big-brother-eye"

[project.scripts]
bbeye = "bbeye.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbeye"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
markers = ["slow: needs model downloads or real hardware"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
